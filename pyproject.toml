[project]
name = "linkingtk"
dynamic = ["version"]
description = "A toolkit unifying Entity Alignment, Entity Linking, Word Sense Disambiguation and Word Sense Alignment."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "John P. McCrae", email = "john@mccr.ae" }]
keywords = [
    "entity-alignment",
    "entity-linking",
    "word-sense-disambiguation",
    "word-sense-alignment",
    "knowledge-graphs",
    "nlp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.19",
    "huggingface-hub>=0.24",
    "peft>=0.11",
    "scikit-learn>=1.7.2",
    "scipy>=1.15",
    "pyyaml>=6.0",
    "tqdm>=4.60",
]

[project.urls]
Homepage = "https://teanga.io/linkingtk/"
Documentation = "https://teanga.io/linkingtk/"
Source = "https://github.com/teangaNLP/linkingtk"
Issues = "https://github.com/teangaNLP/linkingtk/issues"

[project.optional-dependencies]
graph = ["networkx>=3.0", "rdflib>=7.0"]
nlp = ["spacy>=3.7"]
kge = [
    "pykeen>=1.10",
    "rapidfuzz>=3.14.5",
    "networkx>=3.0",
    "gensim>=4.0",
]
wn = ["wn>=0.9"]
wikipedia = ["requests>=2.31"]
vector-index = ["faiss-cpu>=1.8", "sentence-transformers>=3.0"]
llm = ["openai>=1.50", "anthropic>=0.40"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
all = ["linkingtk[graph,nlp,kge,wn,wikipedia,vector-index,llm,server]"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-tqdm>=4.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/linkingtk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/linkingtk"]

[tool.hatch.build.targets.sdist]
include = [
    "src/linkingtk",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
# Not a floor for our own code (requires-python/ruff's target-version stay
# 3.10) -- numpy 2.5.1's shipped stubs use PEP 695 syntax mypy can't parse
# below 3.12, and numpy is now imported directly (algorithms/ea/kge.py).
python_version = "3.12"
strict = true
packages = ["linkingtk"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["networkx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "pykeen.*", "torch.*", "datasets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["faiss.*", "sentence_transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openai.*", "anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gensim.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
